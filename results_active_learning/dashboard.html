<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSR design studio</title>
<meta name="description" content="Interactive surrogate models of an MSR design study, generated by msrframe">
<style>/* msrframe dashboard - print-friendly black & white page in the style of the EVOL MSFR studio,
   with colour-coded series (switch to pure black & white with the toggle in the masthead). */
:root{
  color-scheme:light;
  --ground:#ffffff; --panel:#ffffff; --panel-2:#f4f4f2; --line:#000000; --line-soft:#dcdcdc;
  --ink:#000000; --ink-2:#2b2b2b; --muted:#5f5f5f; --accent:#000000; --accent-ink:#ffffff; --accent-soft:#e8e8e8;
  --grid:#e6e6e6; --axis:#000000; --band:#ececec;
  --good:#1b7f3b; --bad:#b3261e; --warn:#a86400;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --font:"Times New Roman",Times,"Liberation Serif","Nimbus Roman","Nimbus Roman No9 L",serif;
  --mono:"Times New Roman",Times,"Liberation Serif",serif;
}
html[data-palette="mono"]{--s1:#000000;--s2:#4a4a4a;--s3:#000000;--s4:#6e6e6e;--s5:#2b2b2b;--s6:#5a5a5a;--s7:#000000;--s8:#7a7a7a;
  --good:#000000;--bad:#000000;--warn:#555555}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground);color:var(--ink)}
body{margin:0;padding:0 16px 48px;font-family:var(--font);font-size:15.5px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-weight:700;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.1}
h2{font-size:25px;line-height:1.15}
h3{font-size:18px;line-height:1.2}
p{margin:0}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
.num{font-variant-numeric:lining-nums tabular-nums}
.label{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
a{color:var(--ink)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* masthead */
.mast{display:grid;justify-items:center;text-align:center;gap:8px;padding:24px 0 16px;border-bottom:2px solid var(--line)}
.mast .sub{color:var(--ink-2);max-width:78ch;font-style:italic;font-size:16px}
.refcard{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;font-size:14px;color:var(--ink-2)}
.refcard b{color:var(--ink)}
.mast .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13.5px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;padding:12px 0 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ground);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 18px;border:1px solid transparent;border-bottom:none;background:transparent;cursor:pointer;white-space:nowrap;color:#3a3a3a}
.tab:first-child{margin-left:auto}.tab:last-child{margin-right:auto}
.tab .stage{font-size:12.5px;font-style:italic;color:var(--muted)}
.tab .t{font-size:18px;font-weight:700}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.tab[aria-selected="true"] .stage{color:var(--ink)}

/* layout */
section.view{display:grid;gap:18px;padding-top:16px;grid-template-columns:minmax(0,1fr)}
section.view>*,.panel{min-width:0}
.lede{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.lede p{color:var(--ink-2);max-width:70ch;font-size:16px}
.work{display:grid;grid-template-columns:minmax(280px,370px) minmax(0,1fr);gap:18px;align-items:start}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.stack{display:grid;gap:14px;align-content:start}
@media (max-width:980px){.work,.lede,.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px}
.panel h3{margin-bottom:8px}
.panel .psub{font-size:13.5px;color:var(--muted);margin:-4px 0 8px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.phead h3{margin:0}

/* tiles & readouts */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);padding:10px 12px;display:grid;gap:2px;background:var(--panel)}
.tile .tl{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tile .v{font-size:30px;font-weight:700;line-height:1.05}
.tile .v small{font-size:15px;color:var(--ink-2);font-weight:400;margin-left:3px}
.tile .d{font-size:13px;color:var(--ink-2)}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ro{border:1px solid #b3b3b3;padding:10px 12px;display:grid;gap:3px}
.ro .k{font-size:31px;font-weight:700;line-height:1}
.ro .pm{font-size:13.5px;color:var(--ink-2)}
.ro .cmp{font-size:13px;color:var(--ink-2);border-top:1px solid var(--line-soft);padding-top:4px;margin-top:2px}
.ro.truth{border:1.5px solid var(--ink)}

/* controls */
.ctrl{display:grid;gap:3px;padding-block:7px;border-bottom:1px solid var(--line-soft)}
.ctrl:last-of-type{border-bottom:none}
.ctrl .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ctrl .name{font-size:15px}
.ctrl .key{font-size:12px;color:var(--muted)}
.ctrl .val{font-size:15px;font-weight:700;white-space:nowrap}
.ctrl input[type=range]{width:100%;accent-color:var(--ink);margin:2px 0}
.ctrl .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;cursor:pointer;font-size:15px}
.btn:hover{background:#efefef}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2b2b2b}
.btn:disabled{opacity:.55;cursor:progress}
.seg{display:inline-flex;border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:none;background:var(--panel);padding:4px 10px;font-size:14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
select,input[type=number],input[type=text],input[type=search]{background:#fff;border:1px solid var(--line);padding:4px 7px;font-size:14.5px;max-width:100%}
input[type=number]{width:7.5em}
.field{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:4px 10px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line-soft)}
.field .name{font-size:14.5px}
.field .hint{grid-column:1/-1}
.field .numunit{display:inline-flex;gap:6px;align-items:center}
.field .numunit .unit{font-size:13px;color:var(--muted);min-width:3.2em}
.cfield{display:grid;gap:4px;padding-block:7px;border-bottom:1px solid var(--line-soft)}
.cfield .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cfield .bounds{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.cfield .bounds input[type=number]{width:7em}
.hint{display:block;font-size:13px;line-height:1.35;color:var(--muted)}
.section-label{margin-top:12px}
.progress{height:4px;background:#e3e3e3;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;width:0;background:var(--ink);transition:width .15s}

/* notes, chips */
.note{font-size:14.5px;color:var(--ink-2);border-left:2px solid var(--ink);padding-left:10px}
.note.alert{border-left:4px double var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:2px 9px;border:1px solid var(--ink);border-radius:999px;background:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink)}
.chip.pass .dot{background:var(--good)}
.chip.fail .dot{background:#fff;border:1.5px solid var(--bad)}
.chip.fail{color:var(--bad)}
.fchip{border:1px solid var(--ink);background:#fff;border-radius:999px;padding:2px 10px;font-size:13.5px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:#fff}
.guide pre{background:var(--panel-2);border:1px solid var(--line-soft);padding:8px 10px;overflow-x:auto;margin:6px 0 10px;font-size:13.5px}
.guide p{color:var(--ink-2);max-width:85ch}
.guide ol{margin:6px 0 0 18px;padding:0;color:var(--ink-2)}
.guide li{margin-bottom:8px}

/* tables */
.tablewrap{overflow-x:auto;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.tablewrap.scroll{max-height:440px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:5px 9px;text-align:left;vertical-align:top;border-bottom:1px solid #e3e3e3}
th{background:#fff;font-weight:700;border-bottom:1px solid var(--ink);position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tr.hl td{background:#f4f4f2}
.cellbar{display:inline-block;height:7px;background:var(--ink);vertical-align:middle;margin-left:6px;min-width:1px}

/* charts */
.chart{position:relative;width:100%}
.chart>svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.lkey{display:inline-block;vertical-align:middle;width:30px;height:12px}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .axisline{stroke:var(--axis);stroke-width:1}
.chart text{fill:var(--ink-2);font-family:var(--font);font-size:12.5px}
.chart text.axis-title{fill:var(--muted);font-style:italic}
.chart .tick{fill:var(--muted);font-size:12px}
.chart .line{fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .area{opacity:.16;stroke:none}
.chart .hband{fill:var(--band)}
.chart .vband{fill:#f6f6f6}
.chart .band-label,.chart .ref-label{fill:var(--muted);font-size:11.5px;font-style:italic}
.chart .refline{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:4 3}
.chart .errbar{stroke:#c9c9c9;stroke-width:1}
.chart .crosshair{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:2 2}
.chart .overlay{fill:transparent;cursor:crosshair}
.chart .ring{fill:none;stroke:var(--ink);stroke-width:1.5}
.chart .zebra{fill:#fafafa}
.chart .rowlabel{font-size:12.5px;fill:var(--ink-2)}
.chart .rowlabel.strong{font-weight:700;fill:var(--ink)}
.chart .rowlabel.muted{fill:var(--muted);font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
.legend .litem{display:inline-flex;align-items:center;gap:5px}
.legend .muted{font-size:12.5px;font-style:italic}
.lkey{flex:none}
.kname{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.field select{max-width:100%;min-width:0}
.cfield select{width:100%}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--ink);padding:6px 8px;font-size:13.5px;min-width:150px;z-index:6;max-width:320px}
.tip .th{font-weight:700;margin-bottom:2px}
.tip .trow{display:flex;align-items:center;gap:5px;white-space:nowrap}
.tip .tv{font-weight:700}
.tip .tl{color:var(--ink-2)}
@media (max-width:620px){h1{font-size:28px}.tab{padding:6px 10px}.tab .t{font-size:16px}.ro .k{font-size:26px}}
@media print{.tabs{position:static}.btn,.seg,.tools{display:none!important}section.view[hidden]{display:grid!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  // ---------------------------------------------------------------- line chart
  /** cfg: {series:[{name, slot, pts:[[x,y]], band:[[x,lo,hi]], line, markers, width, noLegend, noHover, filled}],
   *   xLabel, yLabel, xDomain, yDomain, xLog, yLog, hlines:[{y,label}], vlines:[{x,label}], hbands:[{y0,y1,label}],
   *   vbands:[{x0,x1,label}], tipFmt(v), xTipFmt(v), height} */
  function lineChart(host, cfg) {
    const series = cfg.series.filter(s => s && ((s.pts && s.pts.length) || (s.band && s.band.length)));
    const xs = [], ys = [];
    series.forEach(s => {
      (s.pts || []).forEach(p => { xs.push(p[0]); ys.push(p[1]); });
      (s.band || []).forEach(b => { xs.push(b[0]); ys.push(b[1], b[2]); });
    });

      const pts = (s.pts || []).filter(p => isF(p[0]) && isF(p[1]) && (!cfg.yLog || p[1] > 0));

  // ---------------------------------------------------------------- scatter chart (parity plots)
  /** cfg: {points:[{x,y,slot,label,extra}], diag:true, xLabel, yLabel, tip(p), height, legend} */
  function scatterChart(host, cfg) {
    const pts = cfg.points.filter(p => isF(p.x) && isF(p.y));
    const all = pts.flatMap(p => [p.x, p.y]);
    let xd = extent(cfg.diag ? all : pts.map(p => p.x)), yd = extent(cfg.diag ? all : pts.map(p => p.y));
    const pad = (xd[1] - xd[0]) * 0.04, pady = (yd[1] - yd[0]) * 0.04;
    xd = [xd[0] - pad, xd[1] + pad]; yd = [yd[0] - pady, yd[1] + pady];
    const F = frame(host, cfg, cfg.xDomain || xd, cfg.yDomain || yd), { plot, sx, sy } = F;
    if (cfg.diag) {
      const a = Math.max(xd[0], yd[0]), b = Math.min(xd[1], yd[1]);
      sv('line', { x1: sx(a), y1: sy(a), x2: sx(b), y2: sy(b), class: 'refline' }, plot);
    }
    pts.forEach(p => {
      if (p.err && isF(p.err)) sv('line', { x1: sx(p.x), x2: sx(p.x), y1: sy(p.y - p.err), y2: sy(p.y + p.err), class: 'errbar' }, plot);
    });

    const overlay = sv('rect', { x: F.px0, y: F.py1, width: F.px1 - F.px0, height: F.py0 - F.py1, class: 'overlay' }, F.svg);
    const move = ev => {
      const r = F.svg.getBoundingClientRect(), px = (ev.clientX - r.left) * F.W / r.width, py = (ev.clientY - r.top) * F.W / r.width;
      let best = null, bd = 24 * 24;
      for (const p of pts) { const dx = sx(p.x) - px, dy = sy(p.y) - py, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = p; } }
      ring.replaceChildren();
      if (!best) { F.tip.hidden = true; return; }
      sv('circle', { cx: sx(best.x), cy: sy(best.y), r: 7, class: 'ring' }, ring);
      F.tip.replaceChildren(...(cfg.tip ? cfg.tip(best) : [hel('div', 'th', best.label || ''), hel('div', 'trow', `${fmtSig(best.x, 5)}, ${fmtSig(best.y, 5)}`)]));
      placeTip(F, F.tip, sx(best.x), sy(best.y));
    };
    overlay.addEventListener('pointermove', move);
    overlay.addEventListener('pointerdown', move);
    overlay.addEventListener('pointerleave', () => { ring.replaceChildren(); F.tip.hidden = true; });
    return F;
  }

  // ---------------------------------------------------------------- importance dot plot (log x)
  /** cfg: {rows:[{label, sub, bold, muted, cells:{method:{v, keep, rank}}}], methods:[{name, slot}], thresholds:{method:v}, xLabel} */
  function dotPlot(host, cfg) {
    host.replaceChildren();
    const wrap = hel('div', 'chart');
    host.appendChild(wrap);
    const lg = hel('div', 'legend');
    const SHAPES = [1, 2, 3, 4, 5];                      // shapes that show filled vs hollow
    cfg.methods.forEach((m, i) => { m.shape = SHAPES[i % SHAPES.length]; const s = hel('span', 'litem'); s.append(swatch(m.slot, { line: false, shape: m.shape }), document.createTextNode(m.name)); lg.append(s); });
    const s2 = hel('span', 'litem muted', 'filled = kept · hollow = dropped · dashed ticks = each method’s noise-calibrated threshold');
    lg.append(s2);
    wrap.appendChild(lg);
    const rowH = 19, W = Math.max(300, Math.round(host.clientWidth || 640));
    const labW = Math.min(300, Math.max(120, W * 0.36));
    const m = { l: labW, r: 14, t: 6, b: 40 }, H = m.t + m.b + rowH * cfg.rows.length;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': cfg.aria || 'importance by method' });
    wrap.appendChild(svg);
    const vals = cfg.rows.flatMap(r => Object.values(r.cells).map(c => c.v)).filter(v => isF(v) && v > 0);
    const lo = Math.max(Math.min(...vals, ...Object.values(cfg.thresholds || {}).filter(v => v > 0)) / 2, 1e-7), hi = 1;
    const sx = makeScale(lo, hi, m.l, W - m.r, true);
    const ticks = logTicks(lo, hi);
    ticks.forEach(v => {
      const x = sx(v);
      sv('line', { x1: x, x2: x, y1: m.t, y2: H - m.b, class: 'gridline' }, svg);
      sv('text', { x, y: H - m.b + 16, 'text-anchor': 'middle', class: 'tick' }, svg).textContent = tickLabel(v);
    });
    sv('text', { x: (m.l + W - m.r) / 2, y: H - 6, 'text-anchor': 'middle', class: 'axis-title' }, svg).textContent = cfg.xLabel || 'share of importance (log)';
    const nM = cfg.methods.length, off = i => (i - (nM - 1) / 2) * Math.min(4.5, 12 / nM);
    cfg.methods.forEach((mm, i) => {
      const t = (cfg.thresholds || {})[mm.name];
      if (!isF(t) || t <= 0) return;
      cfg.rows.forEach((r, ri) => {
        const y = m.t + ri * rowH + rowH / 2 + off(i);
        sv('line', { x1: sx(t), x2: sx(t), y1: y - 4, y2: y + 4, style: `stroke:${colour(mm.slot)};stroke-width:1.2;opacity:.7` }, svg);
      });
    });
    const hits = [];
    cfg.rows.forEach((r, ri) => {
      const y = m.t + ri * rowH + rowH / 2;

    const series = models.map(l => {

      return { name: l, slot: slots[l], pts, band: band.length ? band : null };

    series.push({ name: 'current value', slot: 0, pts: [[x[j], pred(models[0], x)[0]]], line: false, r: 5, noLegend: true, noHover: true });

    table([{ t: 'model' }, { t: 'RMSE (pcm)', num: true }, { t: 'MAE', num: true }, { t: 'max |error|', num: true }, { t: 'bias', num: true }, { t: 'R²', num: true },
      { t: 'noise-corrected', num: true }, { t: '95% interval covers', num: true }, { t: 'fit time (s)', num: true }],

  const tabs = $('#tabs'), host = $('#views'), redraws = {};
  views.forEach(v => {
    const b = el('button', { class: 'tab', role: 'tab', id: 'tab_' + v.id, 'aria-selected': 'false', 'aria-controls': 'view_' + v.id },
      el('span', { class: 'stage', text: v.stage }), el('span', { class: 't', text: v.title }));
    tabs.append(b);
    host.append(el('section', { class: 'view', id: 'view_' + v.id, role: 'tabpanel', hidden: true }));
    b.addEventListener('click', () => show(v.id));
  });
  function show(id) {
    views.forEach(v => { const on = v.id === id; $('#tab_' + v.id).setAttribute('aria-selected', String(on)); $('#view_' + v.id).hidden = !on; });
    const v = views.find(w => w.id === id), sec = $('#view_' + id);
    if (!redraws[id]) {
      try { redraws[id] = v.fn(sec) || (() => {}); } catch (e) { console.error(e); sec.append(el('p', { class: 'note alert', text: 'This view could not be built: ' + e.message })); redraws[id] = () => {}; }
    } else requestAnimationFrame(redraws[id]);
    try { localStorage.setItem('msrframe_tab', id); } catch (e) { /* storage unavailable */ }
  }
  let saved = null;
  try { saved = localStorage.getItem('msrframe_tab'); } catch (e) { saved = null; }
  show(views.some(v => v.id === saved) ? saved : views[0].id);
  // palette toggle (colour / black & white), remembered per browser
  let pal = 'colour';
  try { pal = localStorage.getItem('msrframe_palette') || 'colour'; } catch (e) { /* ignore */ }
  const applyPal = p => { if (p === 'mono') document.documentElement.dataset.palette = 'mono'; else delete document.documentElement.dataset.palette; };
  applyPal(pal);
  $('#tools').append(el('span', { text: 'Series:' }), segmented([{ value: 'colour', label: 'Colour' }, { value: 'mono', label: 'Black & white' }], pal, p => {
    applyPal(p);
    try { localStorage.setItem('msrframe_palette', p); } catch (e) { /* ignore */ }
  }));
  let w = window.innerWidth;
  window.addEventListener('resize', debounce(() => {
    if (Math.abs(window.innerWidth - w) < 30) return;
    w = window.innerWidth;
    const cur = views.find(v => $('#tab_' + v.id).getAttribute('aria-selected') === 'true');
    if (cur && redraws[cur.id]) redraws[cur.id]();
  }, 200));
})();
</script>
</body>
</html>
